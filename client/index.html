<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>こどもレーシング グランプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12203a">
<meta name="description" content="こども向け 4人たいせん レースゲーム。おなじ Wi-Fi のスマホから さんかできます。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='54'%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ゲーム画面（コース・クルマ） -->
  <canvas id="game"></canvas>

  <!-- レース中の情報表示 -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-box" id="hudLap"><b>1</b><span>/3 しゅう</span></div>
      <div class="hud-box big" id="hudPos"><b>1</b><span>い</span></div>
      <div class="hud-box" id="hudMoney">¥0</div>
      <div class="hud-box" id="hudTime">0.00</div>
    </div>
    <div class="hud-right">
      <div id="standings"></div>
      <canvas id="minimap" width="150" height="150"></canvas>
    </div>
    <div class="hud-item" id="hudItem"><span class="slot">-</span></div>
    <div id="bigMsg"></div>
    <div id="toast"></div>
    <div id="emoteBar"></div>
  </div>

  <!-- タッチそうさ（スマホ用） -->
  <div id="touch" class="hidden">
    <div class="tpad tleft" data-key="left">◀</div>
    <div class="tpad tright" data-key="right">▶</div>
    <div class="tpad tbrake" data-key="brake">🛑</div>
    <div class="tpad titem" data-key="item">🎁</div>
    <div class="tpad tgas" data-key="gas">GO!</div>
  </div>

  <!-- メニュー類（タイトル・ロビー・ショップ・けっか） -->
  <div id="ui"></div>

  <script type="module" src="src/main.js"></script>
  <noscript>このゲームは JavaScript が ひつようです。</noscript>
</body>
</html>
